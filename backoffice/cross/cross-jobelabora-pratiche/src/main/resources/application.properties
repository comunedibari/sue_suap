debug=true
server.port=9092

# Cron time start alle ore 00:00
# cronjob=0 0 0 * * ?

# Cron time start servizio di threading ogni minuto
#cronjob=0 0/1 * * * ?

# Cron time start servizio di threading at 2pm every day       
cronjobInboxMassivo=00 00 00 * * ?
cronjobInboxGiornaliero=0 0 */2 * * ?
cronjobRiassegnaUtentePratica=0 0 */5 * * ?


# **** Other properties
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# **** TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true


spring.mail.host=mail.postecert.it
spring.mail.port=465
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.socketFactory.port = 465
spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory

# DATABASE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL5DBDialect
spring.datasource.driver-class-name=com.mysql.jdbc.Driver

