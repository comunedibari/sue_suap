debug=true
server.port=9092
# Cron time start alle ore 00:00
# cronjob=0 0 0 * * ?

# Cron time start servizio di threading ogni minuto
#cronjob=0 0/1 * * * ?

# Cron time start servizio di threading at 2pm every day       
cronjobInboxMassivo=00 30 01 * * ?

#cronjobInboxGiornaliero=00 30 02 * * ?
cronjobInboxGiornaliero=*/60 * * * * ?

#cronjobRiassegnaUtentePratica=0 0 */5 * * ?
cronjobRiassegnaUtentePratica=00 30 02 * * ?

anno.elaborazione=2024,2023,2022,2021
tipo.elaborazione=annuale
