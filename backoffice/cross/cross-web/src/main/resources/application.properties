# 1 (01/01 - 01/04) - 2 (02/04 - 01/07) - 3 (02/07 - 01/10) - 4 (02/10 - 31/12) 
mese.elaborazione=1
numero.giorni.elaborazione.giornaliera=10
 
spring.datasource.driver-class-name=com.mysql.jdbc.Driver


spring.datasource.url=jdbc:mysql://localhost:3306/opencross?serverTimezone=Europe/Rome
